[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baixar-boletins-sigaa"
version = "0.1.0"
description = "Emissao em lote de boletins do SIGAA IFFar (Ensino Tecnico Integrado)"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40.0"]

[project.scripts]
baixar-boletins = "baixar_boletins.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
